name: dotnet-deps
# TODO: Update once 26.10 is stabilized
build-base: devel
base: bare
version: '10.0'
summary: The dependencies to run .NET Apps
description: |
  .NET is a free, cross-platform, open source developer platform for building
  many different types of applications. This image contains the .NET deps,
  but does not include bash, the .NET SDK nor a package manager.
platforms:
  amd64:
  arm64:
  ppc64el:
  s390x:

environment:
  APP_UID: 584792
  ASPNETCORE_URLS: 'http://+:8080'
  DOTNET_RUNNING_IN_CONTAINER: 'true'
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'true'

run-user: _daemon_

parts:
  deps:
    plugin: nil

    # TODO: Uncomment once 26.10 is stabilized
    # stage-packages:
    #   - base-files_base
    #   - base-files_release-info
    #   - base-files_chisel
    #   - ca-certificates_data
    #   - libc6_libs
    #   - libgcc-s1_libs
    #   - libssl3t64_libs
    #   - libstdc++6_libs
    #   - zlib1g_libs

    # TODO: Remove once 26.10 is stabilized
    override-build: |
      craftctl default
      chisel cut --release ubuntu-26.10 --root ${CRAFT_PART_INSTALL} \
        base-files_base \
        base-files_release-info \
        ca-certificates_data \
        libc6_libs \
        libgcc-s1_libs \
        libssl3t64_libs \
        libstdc++6_libs \
        zlib1g_libs


  deb-security-manifest:
    after: [deps]
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
